prepare:
  command: [npm, ci]
  cwd: .
  timeoutSeconds: 600
suites:
  quality:
    cwd: .
    timeoutSeconds: 300
    auto: after-agent
    jobs:
      lint:
        command: [npm, run, lint]
      format:
        command: [npm, run, check:format]
      rust-format:
        command: [npm, run, check:rustfmt]
      types:
        command: [npm, run, typecheck]
      knip:
        command: [npm, run, check:knip]
  test:
    cwd: .
    timeoutSeconds: 600
    auto: after-agent
    jobs:
      architecture:
        command: [npm, run, test:arch]
      application:
        command: [npm, run, test:application]
      ui:
        command: [npm, run, test:ui]
  e2e:
    cwd: .
    timeoutSeconds: 300
    auto: manual
    jobs:
      build:
        command: [npm, run, build]
        timeoutSeconds: 600
      native-test:
        command: [npm, run, test:native]
        timeoutSeconds: 900
      packaging:
        command: [npm, run, test:packaging]
        timeoutSeconds: 1800
