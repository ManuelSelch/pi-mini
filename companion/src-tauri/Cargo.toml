[package]
name = "pi-mini"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-websocket = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
